name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches: [ main, cinema ]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  api-tests:
    name: Run API Tests
    uses: ./.github/workflows/api-tests.yml

  build-and-push:
    needs: api-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Динамически переводим имя репозитория в нижний регистр для GHCR
      - name: Set Image Names to Lowercase
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 1. MONOLITH ---
      - name: Extract metadata for Monolith
        id: meta-monolith
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/monolith
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Monolith
        uses: docker/build-push-action@v5
        with:
          context: ./src/monolith
          push: true
          tags: ${{ steps.meta-monolith.outputs.tags }}
          labels: ${{ steps.meta-monolith.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 2. MOVIES SERVICE ---
      - name: Extract metadata for Movies Service
        id: meta-movies
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/movies-service
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Movies Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/movies
          push: true
          tags: ${{ steps.meta-movies.outputs.tags }}
          labels: ${{ steps.meta-movies.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 3. EVENTS SERVICE ---
      - name: Extract metadata for Events Service
        id: meta-events
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/events-service
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Events Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/events
          push: true
          tags: ${{ steps.meta-events.outputs.tags }}
          labels: ${{ steps.meta-events.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 4. PROXY SERVICE ---
      - name: Extract metadata for Proxy Service
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/proxy-service
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Proxy Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/proxy
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max